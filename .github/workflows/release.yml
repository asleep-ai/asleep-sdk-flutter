name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_MIN_VERSION: 3.44.2
  FLUTTER_VERSION: 3.44.8

jobs:
  minimum-toolchain:
    name: Validate minimum Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up minimum Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_MIN_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test package
        run: flutter test

  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate version contract
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          package_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          requested_version="${REQUESTED_VERSION#v}"
          if [[ ! "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the v<major>.<minor>.<patch> form." >&2
            exit 1
          fi
          if [[ "$package_version" != "$requested_version" ]]; then
            echo "pubspec version $package_version does not match $REQUESTED_VERSION." >&2
            exit 1
          fi
          if ! grep -Fxq "## $package_version" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $package_version." >&2
            exit 1
          fi

      - name: Validate release tag provenance
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in origin/main." >&2
            exit 1
          fi
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Release tags must be annotated and signed." >&2
            exit 1
          fi
          tag_object="$(git rev-parse "$tag_ref")"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" != "true" ]]; then
            echo "GitHub could not verify the release tag signature." >&2
            exit 1
          fi

      - name: Validate public API SemVer
        run: |
          set -euo pipefail
          dart pub global activate dart_apitool 0.23.2
          previous_tag="$(
            git tag --merged "$GITHUB_SHA" --list |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              grep -vxF "$GITHUB_REF_NAME" |
              sort -V |
              tail -n 1 || true
          )"
          if [[ -z "$previous_tag" ]]; then
            dart pub global run dart_apitool:main extract \
              --input . \
              --output "$RUNNER_TEMP/asleep-sdk-flutter-api.json" \
              --set-exit-on-missing-export \
              --force-use-flutter
            exit 0
          fi
          previous_package="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-previous.XXXXXX")"
          git archive "$previous_tag" | tar -x -C "$previous_package"
          dart pub global run dart_apitool:main diff \
            --old "$previous_package" \
            --new . \
            --version-check-mode fully \
            --no-ignore-prerelease \
            --force-use-flutter

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test tool example/lib example/test example/integration_test pigeons

      - name: Analyze
        run: flutter analyze

      - name: Test package
        run: flutter test

      - name: Validate incomplete qualification template
        run: >-
          dart run tool/validate_device_qualification.dart
          --evidence qualification/evidence.template.json
          --allow-incomplete

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Generate API documentation
        run: dart doc

      - name: Report dependency freshness
        run: flutter pub outdated

      - name: Score disposable package copy
        run: |
          package_copy="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-pana.XXXXXX")"
          git archive HEAD | tar -x -C "$package_copy"
          dart pub global activate pana 0.23.15
          dart pub global run pana "$package_copy" \
            --json \
            --exit-code-threshold 20 \
            > pana-report.json

      - name: Upload pana report
        uses: actions/upload-artifact@v7
        with:
          name: pana-report-${{ github.ref_name }}
          path: pana-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Stage public package archive
        run: |
          archive_dir="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-archive.XXXXXX")"
          package_archive="$archive_dir/asleep_sdk_flutter.tar.gz"
          package_copy="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-publish.XXXXXX")"
          dart pub publish --to-archive "$package_archive"
          tar -xzf "$package_archive" -C "$package_copy"
          echo "PACKAGE_COPY=$package_copy" >> "$GITHUB_ENV"

      - name: Scan staged archive
        run: |
          if find "$PACKAGE_COPY" -type f \
            \( -name "*.jks" \
              -o -name "*.keystore" \
              -o -name "*.p12" \
              -o -name "*.mobileprovision" \
              -o -name ".env" \
              -o -name "local.properties" \) \
            -print -quit | grep -q .; then
            echo "The staged package contains a sensitive file type." >&2
            exit 1
          fi
          if rg -l \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' \
            "$PACKAGE_COPY" > /dev/null; then
            echo "The staged package contains a potential credential." >&2
            exit 1
          fi

      - name: Validate public package archive
        run: cd "$PACKAGE_COPY" && dart pub publish --dry-run

  android:
    name: Validate Android release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Record consumer toolchain
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Stage candidate package
        run: |
          archive_dir="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-archive.XXXXXX")"
          package_archive="$archive_dir/asleep_sdk_flutter.tar.gz"
          package_copy="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-consumer.XXXXXX")"
          dart pub publish --to-archive "$package_archive"
          tar -xzf "$package_archive" -C "$package_copy"
          echo "PACKAGE_COPY=$package_copy" >> "$GITHUB_ENV"

      - name: Resolve candidate in clean consumer
        run: |
          consumer="$(mktemp -d "$RUNNER_TEMP/asleep-consumer-android.XXXXXX")"
          flutter create \
            --empty \
            --org ai.asleep \
            --platforms android \
            --project-name asleep_consumer \
            "$consumer"
          cp .github/fixtures/consumer_main.dart "$consumer/lib/main.dart"
          flutter pub add \
            --no-example \
            --directory "$consumer" \
            "asleep_sdk_flutter@{path: $PACKAGE_COPY}"
          echo "CONSUMER=$consumer" >> "$GITHUB_ENV"

      - name: Analyze candidate consumer
        run: flutter analyze "$CONSUMER"

      - name: Build release example
        working-directory: example
        run: flutter build apk --release

      - name: Build candidate consumer APK
        run: cd "$CONSUMER" && flutter build apk --release

      - name: Test Android bridge
        working-directory: example/android
        run: ./gradlew :asleep_sdk_flutter:testDebugUnitTest

      - name: Lint release example
        working-directory: example/android
        run: ./gradlew :app:lintRelease

  ios:
    name: Validate iOS release candidate
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Record consumer toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Install dependencies
        run: flutter pub get

      - name: Stage candidate package
        run: |
          archive_dir="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-archive.XXXXXX")"
          package_archive="$archive_dir/asleep_sdk_flutter.tar.gz"
          package_copy="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-consumer.XXXXXX")"
          dart pub publish --to-archive "$package_archive"
          tar -xzf "$package_archive" -C "$package_copy"
          echo "PACKAGE_COPY=$package_copy" >> "$GITHUB_ENV"

      - name: Resolve candidate in clean consumer
        run: |
          consumer="$(mktemp -d "$RUNNER_TEMP/asleep-consumer-ios.XXXXXX")"
          flutter create \
            --empty \
            --org ai.asleep \
            --platforms ios \
            --project-name asleep_consumer \
            "$consumer"
          cp .github/fixtures/consumer_main.dart "$consumer/lib/main.dart"
          flutter pub add \
            --no-example \
            --directory "$consumer" \
            "asleep_sdk_flutter@{path: $PACKAGE_COPY}"
          sed -i.bak \
            "s/# platform :ios, '13.0'/platform :ios, '15.0'/" \
            "$consumer/ios/Podfile"
          sed -i.bak \
            's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' \
            "$consumer/ios/Runner.xcodeproj/project.pbxproj"
          perl -0pi.bak -e \
            's/    flutter_additional_ios_build_settings\(target\)\n/    flutter_additional_ios_build_settings(target)\n    target.build_configurations.each do |config|\n      config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.0"\n    end\n/' \
            "$consumer/ios/Podfile"
          echo "CONSUMER=$consumer" >> "$GITHUB_ENV"

      - name: Analyze candidate consumer
        run: flutter analyze "$CONSUMER"

      - name: Validate CocoaPods plugin
        working-directory: ios
        run: pod lib lint asleep_sdk_flutter.podspec --allow-warnings --skip-tests

      - name: Build simulator example
        working-directory: example
        run: flutter build ios --simulator --debug

      - name: Test iOS bridge
        working-directory: example/ios
        run: >-
          xcodebuild
          -workspace Runner.xcworkspace
          -scheme Runner
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          test
          CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned release example
        working-directory: example
        run: flutter build ios --release --no-codesign

      - name: Build candidate consumer
        run: cd "$CONSUMER" && flutter build ios --release --no-codesign

  device-qualification:
    name: Require physical-device qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Explain validation-only dispatch
        if: ${{ github.event_name != 'push' }}
        run: echo "Physical-device evidence is required only for a release tag."

      - name: Set up Flutter
        if: ${{ github.event_name == 'push' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Download exact-commit qualification artifact
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_ALLOWLIST: ${{ vars.DEVICE_QUALIFICATION_REVIEWERS }}
        run: |
          set -euo pipefail
          run_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/device-qualification.yml/runs?event=workflow_dispatch&status=success&head_sha=$GITHUB_SHA&per_page=100" \
              --jq '.workflow_runs | map(select(.head_sha == env.GITHUB_SHA and .conclusion == "success")) | sort_by(.created_at) | last | .id // empty'
          )"
          if [[ -z "$run_id" ]]; then
            echo "No successful device qualification run exists for $GITHUB_SHA." >&2
            exit 1
          fi
          artifact_url="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '.artifacts | map(select(.name == "device-qualification-" + env.GITHUB_SHA and .expired == false)) | first | .archive_download_url // empty'
          )"
          if [[ -z "$artifact_url" ]]; then
            echo "The exact-commit device qualification artifact is missing or expired." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/device-qualification"
          gh api "$artifact_url" > "$RUNNER_TEMP/device-qualification.zip"
          unzip -q "$RUNNER_TEMP/device-qualification.zip" -d "$RUNNER_TEMP/device-qualification"
          test "$(cat "$RUNNER_TEMP/device-qualification/commit-sha.txt")" = "$GITHUB_SHA"
          test "$(jq -r .commitSha "$RUNNER_TEMP/device-qualification/attestation.json")" = "$GITHUB_SHA"
          test "$(jq -r .workflowRunId "$RUNNER_TEMP/device-qualification/attestation.json")" = "$run_id"
          run_actor="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .actor.login)"
          test -n "$run_actor"
          attested_operator="$(jq -er .operator "$RUNNER_TEMP/device-qualification/attestation.json")"
          evidence_operator="$(jq -er .run.operator "$RUNNER_TEMP/device-qualification/evidence.json")"
          [[ "${attested_operator,,}" == "${run_actor,,}" ]]
          [[ "${evidence_operator,,}" == "${run_actor,,}" ]]
          evidence_digest="$(sha256sum "$RUNNER_TEMP/device-qualification/evidence.json" | awk '{print $1}')"
          test "$(jq -r .evidenceSha256 "$RUNNER_TEMP/device-qualification/attestation.json")" = "$evidence_digest"
          comment_id="$(jq -r .approvalCommentId "$RUNNER_TEMP/device-qualification/attestation.json")"
          [[ "$comment_id" =~ ^[0-9]+$ ]]
          comment="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id")"
          reviewer="$(jq -er .user.login <<< "$comment")"
          attested_reviewer="$(jq -er .reviewer "$RUNNER_TEMP/device-qualification/attestation.json")"
          [[ "${reviewer,,}" == "${attested_reviewer,,}" ]]
          test "${reviewer,,}" != "${run_actor,,}"
          jq -e '
            type == "array" and
            length > 0 and
            all(.[];
              type == "string" and
              test("^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$")
            ) and
            ([.[] | ascii_downcase] | length == (unique | length))
          ' <<< "$REVIEWER_ALLOWLIST" > /dev/null
          jq -e --arg reviewer "${reviewer,,}" 'map(ascii_downcase) | index($reviewer) != null' <<< "$REVIEWER_ALLOWLIST" > /dev/null
          expected_body="$(printf 'ASLEEP_DEVICE_QUALIFICATION_APPROVAL_V1\ncommit=%s\nevidence_sha256=%s' "$GITHUB_SHA" "$evidence_digest")"
          test "$(jq -r .body <<< "$comment")" = "$expected_body"
          comment_created_at="$(jq -er .created_at <<< "$comment")"
          comment_updated_at="$(jq -er .updated_at <<< "$comment")"
          test "$comment_created_at" = "$(jq -r .approvalCreatedAt "$RUNNER_TEMP/device-qualification/attestation.json")"
          test "$comment_updated_at" = "$(jq -r .approvalUpdatedAt "$RUNNER_TEMP/device-qualification/attestation.json")"
          evidence_completed_at="$(jq -er .run.completedAt "$RUNNER_TEMP/device-qualification/evidence.json")"
          comment_updated_epoch="$(date -u -d "$comment_updated_at" +%s)"
          evidence_completed_epoch="$(date -u -d "$evidence_completed_at" +%s)"
          (( comment_updated_epoch >= evidence_completed_epoch ))

      - name: Resolve candidate versions
        if: ${{ github.event_name == 'push' }}
        run: |
          package_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          dart_version="$(dart --version 2>&1 | sed -E 's/^Dart SDK version: ([0-9.]+).*/\1/')"
          android_native_version="$(sed -n 's/.*asleepsdk:\([0-9.]*\).*/\1/p' android/build.gradle.kts)"
          ios_native_version="$(sed -n "s/.*AsleepSDK', '\\([0-9.]*\\)'.*/\\1/p" ios/asleep_sdk_flutter.podspec)"
          {
            printf 'PACKAGE_VERSION=%s\n' "$package_version"
            printf 'DART_VERSION=%s\n' "$dart_version"
            printf 'ANDROID_NATIVE_VERSION=%s\n' "$android_native_version"
            printf 'IOS_NATIVE_VERSION=%s\n' "$ios_native_version"
          } >> "$GITHUB_ENV"

      - name: Revalidate exact-commit evidence
        if: ${{ github.event_name == 'push' }}
        run: >-
          dart run tool/validate_device_qualification.dart
          --evidence "$RUNNER_TEMP/device-qualification/evidence.json"
          --expected-commit "$GITHUB_SHA"
          --expected-package-version "$PACKAGE_VERSION"
          --expected-flutter-version "$FLUTTER_VERSION"
          --expected-dart-version "$DART_VERSION"
          --expected-android-native-version "$ANDROID_NATIVE_VERSION"
          --expected-ios-native-version "$IOS_NATIVE_VERSION"

  publish:
    name: Publish to pub.dev
    needs:
      - minimum-toolchain
      - validate
      - android
      - ios
      - device-qualification
    if: >-
      github.event_name == 'push' &&
      vars.PUBDEV_PUBLISH_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev

  hosted-consumer:
    name: Verify published package
    needs:
      - publish
    if: ${{ needs.publish.result == 'success' }}
    uses: ./.github/workflows/hosted-consumer.yml
    with:
      version: ${{ github.ref_name }}

  github-release:
    name: Create GitHub Release
    needs:
      - minimum-toolchain
      - validate
      - android
      - ios
      - device-qualification
      - publish
      - hosted-consumer
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.minimum-toolchain.result == 'success' &&
      needs.validate.result == 'success' &&
      needs.android.result == 'success' &&
      needs.ios.result == 'success' &&
      needs.device-qualification.result == 'success' &&
      (
        (
          needs.publish.result == 'success' &&
          needs.hosted-consumer.result == 'success'
        ) ||
        needs.publish.result == 'skipped'
      ) &&
      vars.RELEASE_CREATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
