name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  dart:
    name: Dart contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test example/lib example/test example/integration_test pigeons

      - name: Analyze
        run: flutter analyze

      - name: Test package
        run: flutter test

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Generate API documentation
        run: dart doc

      - name: Report dependency freshness
        run: flutter pub outdated

      - name: Validate package
        run: dart pub publish --dry-run

  android:
    name: Android bridge and example
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

      - name: Test Android bridge
        working-directory: example/android
        run: ./gradlew :asleep_sdk_flutter:testDebugUnitTest

      - name: Upload example APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: asleep-sdk-flutter-example-android
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS bridge and example
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate CocoaPods plugin
        working-directory: ios
        run: pod lib lint asleep_sdk_flutter.podspec --allow-warnings --skip-tests

      - name: Build simulator example
        working-directory: example
        run: flutter build ios --simulator --debug

      - name: Package simulator example
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: example
        run: >-
          tar -czf build/ios/asleep-sdk-flutter-example-ios-simulator.tar.gz
          -C build/ios/iphonesimulator Runner.app

      - name: Upload simulator example
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: asleep-sdk-flutter-example-ios-simulator
          path: example/build/ios/asleep-sdk-flutter-example-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 7
