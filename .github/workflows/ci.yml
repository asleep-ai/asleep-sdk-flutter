name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_MIN_VERSION: 3.44.2
  FLUTTER_VERSION: 3.44.8

jobs:
  dart-minimum:
    name: Dart contracts (minimum Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up minimum Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_MIN_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test package
        run: flutter test

  dart:
    name: Dart contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test tool example/lib example/test example/integration_test pigeons

      - name: Analyze
        run: flutter analyze

      - name: Test package
        run: flutter test

      - name: Validate incomplete qualification template
        run: >-
          dart run tool/validate_device_qualification.dart
          --evidence qualification/evidence.template.json
          --allow-incomplete

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Generate API documentation
        run: dart doc

      - name: Report dependency freshness
        run: flutter pub outdated

      - name: Validate package
        run: dart pub publish --dry-run

  android:
    name: Android bridge and example
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Record consumer toolchain
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Stage candidate package
        run: |
          archive_dir="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-archive.XXXXXX")"
          package_archive="$archive_dir/asleep_sdk_flutter.tar.gz"
          package_copy="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-consumer.XXXXXX")"
          dart pub publish --to-archive "$package_archive"
          tar -xzf "$package_archive" -C "$package_copy"
          echo "PACKAGE_COPY=$package_copy" >> "$GITHUB_ENV"

      - name: Resolve candidate in clean consumer
        run: |
          consumer="$(mktemp -d "$RUNNER_TEMP/asleep-consumer-android.XXXXXX")"
          flutter create \
            --empty \
            --org ai.asleep \
            --platforms android \
            --project-name asleep_consumer \
            "$consumer"
          cp .github/fixtures/consumer_main.dart "$consumer/lib/main.dart"
          flutter pub add \
            --no-example \
            --directory "$consumer" \
            "asleep_sdk_flutter@{path: $PACKAGE_COPY}"
          echo "CONSUMER=$consumer" >> "$GITHUB_ENV"

      - name: Analyze candidate consumer
        run: flutter analyze "$CONSUMER"

      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

      - name: Build candidate consumer APK
        run: cd "$CONSUMER" && flutter build apk --debug

      - name: Test Android bridge
        working-directory: example/android
        run: ./gradlew :asleep_sdk_flutter:testDebugUnitTest

      - name: Upload example APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: asleep-sdk-flutter-example-android
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS bridge and example
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Record consumer toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Install dependencies
        run: flutter pub get

      - name: Stage candidate package
        run: |
          archive_dir="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-archive.XXXXXX")"
          package_archive="$archive_dir/asleep_sdk_flutter.tar.gz"
          package_copy="$(mktemp -d "$RUNNER_TEMP/asleep-sdk-consumer.XXXXXX")"
          dart pub publish --to-archive "$package_archive"
          tar -xzf "$package_archive" -C "$package_copy"
          echo "PACKAGE_COPY=$package_copy" >> "$GITHUB_ENV"

      - name: Resolve candidate in clean consumer
        run: |
          consumer="$(mktemp -d "$RUNNER_TEMP/asleep-consumer-ios.XXXXXX")"
          flutter create \
            --empty \
            --org ai.asleep \
            --platforms ios \
            --project-name asleep_consumer \
            "$consumer"
          cp .github/fixtures/consumer_main.dart "$consumer/lib/main.dart"
          flutter pub add \
            --no-example \
            --directory "$consumer" \
            "asleep_sdk_flutter@{path: $PACKAGE_COPY}"
          sed -i.bak \
            "s/# platform :ios, '13.0'/platform :ios, '15.0'/" \
            "$consumer/ios/Podfile"
          sed -i.bak \
            's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' \
            "$consumer/ios/Runner.xcodeproj/project.pbxproj"
          perl -0pi.bak -e \
            's/    flutter_additional_ios_build_settings\(target\)\n/    flutter_additional_ios_build_settings(target)\n    target.build_configurations.each do |config|\n      config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.0"\n    end\n/' \
            "$consumer/ios/Podfile"
          echo "CONSUMER=$consumer" >> "$GITHUB_ENV"

      - name: Analyze candidate consumer
        run: flutter analyze "$CONSUMER"

      - name: Validate CocoaPods plugin
        working-directory: ios
        run: pod lib lint asleep_sdk_flutter.podspec --allow-warnings --skip-tests

      - name: Build candidate consumer
        run: cd "$CONSUMER" && flutter build ios --simulator --debug

      - name: Build simulator example
        working-directory: example
        run: flutter build ios --simulator --debug

      - name: Test iOS bridge
        working-directory: example/ios
        run: >-
          xcodebuild
          -workspace Runner.xcworkspace
          -scheme Runner
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          test
          CODE_SIGNING_ALLOWED=NO

      - name: Package simulator example
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: example
        run: >-
          tar -czf build/ios/asleep-sdk-flutter-example-ios-simulator.tar.gz
          -C build/ios/iphonesimulator Runner.app

      - name: Upload simulator example
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: asleep-sdk-flutter-example-ios-simulator
          path: example/build/ios/asleep-sdk-flutter-example-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 7
